# ==============================================================
# PostureSec - Posture Cybersecurity Platform - Kubernetes Manifest
# Sprint 6 (DSO-601..604). PostgreSQL is a StatefulSet (DSO-602).
# Non-sensitive config is a ConfigMap; NO secrets are hardcoded here.
#
# Secrets are created out-of-band BEFORE applying this file (DSO-603 order:
# namespace -> secrets -> configmaps -> deployments -> services):
#   kubectl apply -f k8s/namespace.yaml
#   kubectl create secret generic posturesec-db-secret -n posturesec \
#     --from-literal=POSTGRES_USER=... --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=POSTGRES_DB=...
#   kubectl create secret docker-registry ghcr-secret -n posturesec \
#     --docker-server=ghcr.io --docker-username=<gh-user> --docker-password=<read:packages token>
#   kubectl apply -f k8s/posturesec.yaml
# ==============================================================

# ---- Non-sensitive application config ----
apiVersion: v1
kind: ConfigMap
metadata:
  name: posturesec-config
  namespace: posturesec
  labels:
    app.kubernetes.io/part-of: posturesec
data:
  DB_HOST: "posturesec-postgres"
  DB_PORT: "5432"
  PORT: "5000"

---
# ---- EBS StorageClass (gp3) ----
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: posturesec-ebs-sc
provisioner: ebs.csi.eks.amazonaws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true

---
# ---- PostgreSQL StatefulSet (DSO-602) ----
# StatefulSet (not Deployment) for stable identity + per-replica PVC via
# volumeClaimTemplates. Data persists across pod delete/reschedule.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: posturesec-db
  namespace: posturesec
  labels:
    app.kubernetes.io/name: posturesec-db
    app.kubernetes.io/part-of: posturesec
    app.kubernetes.io/component: database
spec:
  serviceName: posturesec-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: posturesec-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posturesec-db
        app.kubernetes.io/part-of: posturesec
        app.kubernetes.io/component: database
    spec:
      # Security: DB doesn't need the K8s API
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: "karpenter.sh/disrupted"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: postgres
          image: public.ecr.aws/docker/library/postgres:16-alpine
          ports:
            - containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: posturesec-db-secret
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Postgres needs write access
            runAsNonRoot: false            # Postgres image runs initdb as root then drops
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "posturesec_user", "-d", "posturesec_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "posturesec_user", "-d", "posturesec_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
  volumeClaimTemplates:
    - metadata:
        name: db-storage
        labels:
          app.kubernetes.io/part-of: posturesec
          app.kubernetes.io/component: database
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: posturesec-ebs-sc
        resources:
          requests:
            storage: 10Gi

---
# ---- PostgreSQL headless Service (StatefulSet serviceName; ClusterIP: None) ----
apiVersion: v1
kind: Service
metadata:
  name: posturesec-db
  namespace: posturesec
  labels:
    app.kubernetes.io/name: posturesec-db
    app.kubernetes.io/part-of: posturesec
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: posturesec-db
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP

---
# ---- Backend Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: posturesec-backend
  namespace: posturesec
  labels:
    app.kubernetes.io/name: posturesec-backend
    app.kubernetes.io/part-of: posturesec
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: posturesec-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posturesec-backend
        app.kubernetes.io/part-of: posturesec
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-secret
      tolerations:
        - key: "karpenter.sh/disrupted"
          operator: "Exists"
          effect: "NoSchedule"
      initContainers:
        - name: wait-for-db
          image: public.ecr.aws/docker/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for posturesec-db:5432..."
              until nc -z posturesec-db 5432; do
                echo "DB not ready, retrying in 3s..."
                sleep 3
              done
              echo "DB is ready!"
      containers:
        - name: backend
          image: ghcr.io/posture-cybersecurity/posturesec-devsecops-lab/posturesec-backend:ab0403d
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: posturesec-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: posturesec-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: posturesec-db-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: posturesec-db-secret
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3

---
# ---- Backend Service (ClusterIP - internal only) ----
apiVersion: v1
kind: Service
metadata:
  name: posturesec-backend
  namespace: posturesec
  labels:
    app.kubernetes.io/name: posturesec-backend
    app.kubernetes.io/part-of: posturesec
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: posturesec-backend
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP

---
# ---- Frontend Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: posturesec-frontend
  namespace: posturesec
  labels:
    app.kubernetes.io/name: posturesec-frontend
    app.kubernetes.io/part-of: posturesec
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: posturesec-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: posturesec-frontend
        app.kubernetes.io/part-of: posturesec
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-secret
      tolerations:
        - key: "karpenter.sh/disrupted"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: frontend
          image: ghcr.io/posture-cybersecurity/posturesec-devsecops-lab/posturesec-frontend:ab0403d
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Nginx needs write for cache/pid
            runAsNonRoot: true
            runAsUser: 101 # nginx user UID in alpine
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

---
# ---- Frontend Service (NodePort) ----
# NOTE: NodePort, not LoadBalancer (DSO-604): this AWS account cannot create
# ELBs. Access via `kubectl port-forward svc/posturesec-frontend 8080:80 -n posturesec`.
apiVersion: v1
kind: Service
metadata:
  name: posturesec-frontend
  namespace: posturesec
  labels:
    app.kubernetes.io/name: posturesec-frontend
    app.kubernetes.io/part-of: posturesec
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: posturesec-frontend
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP

---
# ---- NetworkPolicy: default-deny all ingress in the namespace (DSO-604) ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: posturesec
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# ---- NetworkPolicy: DB accepts traffic ONLY from Backend ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: posturesec-db-allow-backend-only
  namespace: posturesec
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: posturesec-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: posturesec-backend
      ports:
        - port: 5432
          protocol: TCP

---
# ---- NetworkPolicy: Backend accepts traffic ONLY from Frontend ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: posturesec-backend-allow-frontend-only
  namespace: posturesec
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: posturesec-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: posturesec-frontend
      ports:
        - port: 5000
          protocol: TCP

---
# ---- NetworkPolicy: Frontend is the public entrypoint (allow :8080) ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: posturesec-frontend-allow-ingress
  namespace: posturesec
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: posturesec-frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
