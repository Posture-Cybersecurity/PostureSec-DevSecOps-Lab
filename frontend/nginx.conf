server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve static files, fallback to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend by its Compose SERVICE NAME (`backend`),
    # resolved over Docker's built-in DNS on the isolated posturenet network.
    # Not a container_name, not localhost, not a host port — service discovery.
    #
    # Resolve `backend` at REQUEST time via Docker's embedded DNS (127.0.0.11),
    # not once at worker startup. A hostname written directly in proxy_pass is
    # resolved only at startup and cached for the worker's whole life, so if the
    # backend container ever gets a new IP (restart, recreate, scale) nginx keeps
    # dialling the old address and every /api call returns 502. Putting the
    # upstream in a variable forces nginx to use the `resolver` per request, with
    # `valid=10s` bounding how long a lookup is cached.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://backend:5000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Security: deny access to dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }
}
