# PostureSec — full local stack (Sprint 4: Compose & Service Networking)
#
# Three services on ONE explicitly-defined, isolated bridge network. Each
# service reaches the others by its *service name* over Docker's built-in DNS —
# never localhost, never a published host port, never host networking:
#
#     frontend  --(http://backend:5000)-->  backend  --(db:5432)-->  db
#
# Only the frontend is published to the host (port 80). The backend is reachable
# only from inside the network (expose, not ports); PostgreSQL is not published
# at all — nothing needs to reach it except the backend.
#
# Startup is health-aware: backend waits for db to be *healthy*, and frontend
# waits for backend to be *healthy*, so `docker compose up` converges to a
# working stack from a clean clone with no manual ordering.
#
# No fixed container_name is set on any service: containers are addressed by
# their Compose SERVICE NAME over Docker DNS (db, backend, frontend). That is the
# point of DSO-402, and it also means this stack never collides with another
# project's container names on a shared host.

services:
  # ---- PostgreSQL database ----
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Local training credentials only — synthetic, not real secrets, and they
      # authenticate to nothing outside this disposable stack.
      POSTGRES_USER: posturesec_user
      POSTGRES_PASSWORD: posturesec_pass_2026
      POSTGRES_DB: posturesec_db
    # Deliberately NOT published to the host. The database is an internal tier;
    # only `backend` talks to it, by the service name `db` on posturenet. If you
    # ever need host access for debugging, add a `ports:` mapping yourself — the
    # reference stack does not expose it.
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - posturenet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posturesec_user -d posturesec_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    tmpfs:
      - /run

  # ---- Backend API (Node.js / Express) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "5000"
      DB_USER: posturesec_user
      DB_PASSWORD: posturesec_pass_2026
      # Service-name DNS: the backend finds PostgreSQL as `db` on posturenet.
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: posturesec_db
    # Internal only: reachable by `frontend` as backend:5000, never from the host.
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - posturenet
    healthcheck:
      # Uses the image's own Node runtime — no extra packages, no writes (the
      # container runs read-only). Lets `frontend` gate on a genuinely-ready API.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:5000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # ---- Frontend (Nginx serving React, proxying /api to the backend) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # The one intentional host exposure: the UI on http://localhost:80.
    ports:
      - "80:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - posturenet
    healthcheck:
      # busybox wget ships in nginx:alpine; -O /dev/null keeps the read-only-ish
      # container from writing anything meaningful.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

# One explicit, isolated bridge network for the whole stack. Defining it (rather
# than leaning on Compose's implicit default network) is the point of DSO-402:
# the topology is declared, not incidental.
networks:
  posturenet:
    driver: bridge

volumes:
  pgdata:
    driver: local
